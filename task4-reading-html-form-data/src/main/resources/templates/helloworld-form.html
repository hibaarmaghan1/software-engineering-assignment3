<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hello World - Input Form</title>
</head>
<body>

  <form th:action="@{/processForm}" method="GET">

      Your Name:
      <input type="text" name="studentName"
             placeholder="What's your name?" />

      <br><br>

      Favorite Sport Name:
      <input type="text" name="sportName"
             placeholder="What's your favorite sport?" />

      <br><br>

      <input type="submit" />

  </form>

</body>
</html>
